user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen       80;
        listen       [::]:80;
        server_name  ravi-devops.space frontend.ravi-devops.space _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Serve static frontend UI
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse Proxy: Event Service
        location /api/events {
            proxy_pass http://event.ravi-devops.space:8080/api/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Reverse Proxy: User Service
        location /api/users {
            proxy_pass http://user.ravi-devops.space:8080/api/users;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Reverse Proxy: Reservation Service
        location /api/reserve {
            proxy_pass http://reservation.ravi-devops.space:8080/api/reserve;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Reverse Proxy: Booking Service
        location /api/bookings {
            proxy_pass http://booking.ravi-devops.space:8080/api/bookings;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Cluster Health Check Endpoints for Dashboard
        location /health/event {
            proxy_pass http://event.ravi-devops.space:8080/health;
        }
        location /health/user {
            proxy_pass http://user.ravi-devops.space:8080/health;
        }
        location /health/reservation {
            proxy_pass http://reservation.ravi-devops.space:8080/health;
        }
        location /health/booking {
            proxy_pass http://booking.ravi-devops.space:8080/health;
        }
        location /health/worker {
            proxy_pass http://worker.ravi-devops.space:8080/health;
        }
    }
}
